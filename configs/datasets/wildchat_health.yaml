  - symptoms
  - pain
  - cough
  - fever
  - headache
  - nausea
  - dizzy
  - medication
  - medicine
  - doctor
  - clinic
  - hospital
  - diagnosis
  - treatment
  - test result
  - blood test
  - health
  - medical
  - breathing
  - rash
  - infection
patient_information_markers:
  - i have
  - i've had
  - started
  - for days
  - for weeks
  - getting worse
  - taking
  - my medication
  - my symptoms
  - also
  - no history
  - yes
personal_consultation_markers:
  - i have
  - i've had
  - i am taking
  - i'm taking
  - my symptom
  - my pain
  - my doctor
  - my medication
  - should i see
  - happened to me
respiratory_keywords:
  - cough
  - sputum
  - shortness of breath
  - breathing
  - wheeze
  - sore throat
  - congestion
  - chest pain
