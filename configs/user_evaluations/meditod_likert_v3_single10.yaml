    - sample_id: meditod_public_raw_59f75ec389307fb6#assistant-0015
      reason: 咳の時間帯を尋ねる内容が3応答で近く、人手が戦略差を識別しにくい
    - sample_id: meditod_public_raw_df049c8c24a9a145#assistant-0080
      reason: BASiSとRandomがほぼ同じ家族症状の確認で、人手が差を識別しにくい
  rank_weights:
    basis_advantage: 1.0
    axis_win_fraction: 0.35
    text_distinctness: 0.50
