    - sample_id: meditod_public_raw_22eb87127deb0393#assistant-0066
      reason: 娘の年齢を患者本人の年齢と取り違えており、3応答とも文脈理解が破綻している
    - sample_id: meditod_public_raw_3c2e722e5a05cbf7#assistant-0084
